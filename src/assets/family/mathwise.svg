<!-- O ícone do mathwise: um número dentro de um cérebro — cálculo mental, não calculadora.
     Paleta Noite da família *wise (#1e1b4b + #e0e7ff/#a5b4fc; wisekit, guia/01-identidade.md).
     O número é centrado no MIOLO do cérebro (mesmo centro ótico do contorno: 32, 30.2), senão
     ele desce e encosta na borda de baixo. É também o favicon (public/favicon.svg é cópia,
     feita pelo scripts/gen-icons.sh). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#1e1b4b"/>
  <!-- o cérebro: dois hemisférios com o sulco no alto -->
  <g fill="none" stroke="#e0e7ff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 15c-4-3-10-2-12 3-5 0-8 5-6 9-4 3-3 9 1 11 0 5 5 8 9 6 2 3 6 4 8 2"/>
    <path d="M32 15c4-3 10-2 12 3 5 0 8 5 6 9 4 3 3 9-1 11 0 5-5 8-9 6-2 3-6 4-8 2"/>
    <path d="M32 15v3.5"/>
  </g>
  <!-- o número por dentro: a conta que acontece na cabeça -->
  <path d="M26 21.7h12l-7 17" fill="none" stroke="#a5b4fc" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
