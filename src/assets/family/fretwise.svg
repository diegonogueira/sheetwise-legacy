<!-- O ícone do fretwise: a mão do violão (headstock) com o marcador de estudo e notas no braço.
     Paleta Noite da família *wise (wisekit, guia/01-identidade.md): ladrilho #1e1b4b, arte #e0e7ff
     e detalhes #a5b4fc. É também o favicon (public/favicon.svg é cópia, gerada pelo gen-icons.sh). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#1e1b4b"/>
  <g>
    <!-- as tarraxas: três de cada lado -->
    <g fill="#e0e7ff">
      <rect x="17" y="20" width="4" height="2" rx="0.5"/><ellipse cx="15" cy="21" rx="3.4" ry="2.9"/>
      <rect x="17" y="30" width="4" height="2" rx="0.5"/><ellipse cx="15.4" cy="31" rx="3.4" ry="2.9"/>
      <rect x="18" y="40" width="4" height="2" rx="0.5"/><ellipse cx="15.8" cy="41" rx="3.4" ry="2.9"/>
      <rect x="43" y="20" width="4" height="2" rx="0.5"/><ellipse cx="49" cy="21" rx="3.4" ry="2.9"/>
      <rect x="43" y="30" width="4" height="2" rx="0.5"/><ellipse cx="48.6" cy="31" rx="3.4" ry="2.9"/>
      <rect x="42" y="40" width="4" height="2" rx="0.5"/><ellipse cx="48.2" cy="41" rx="3.4" ry="2.9"/>
    </g>
    <!-- a mão do violão, estreitando até o traste zero -->
    <path d="M20 13.2 Q32 9 44 13.2 L42.2 43.5 Q40.2 47.5 39.6 52 L24.4 52 Q23.8 47.5 21.8 43.5 Z" fill="#e0e7ff"/>
    <!-- as fendas das cordas -->
    <g stroke="#1e1b4b" stroke-width="0.9" stroke-linecap="round" fill="none">
      <path d="M26 23.5 L27.6 52"/><path d="M32 23 L32 52"/><path d="M37.9 23.5 L36.4 52"/>
    </g>
    <!-- o marcador de livro (estudo) e as notas no braço, em lavanda -->
    <path d="M28.6 10.6 H35.4 V21.6 L32 19.2 L28.6 21.6 Z" fill="#a5b4fc"/>
    <g fill="#a5b4fc" stroke="#1e1b4b" stroke-width="0.6">
      <circle cx="26.3" cy="28.5" r="2"/><circle cx="27" cy="39.5" r="2"/><circle cx="37.3" cy="34" r="2"/>
    </g>
    <!-- o traste zero -->
    <rect x="24" y="52" width="16" height="1.8" rx="0.6" fill="#a5b4fc"/>
  </g>
</svg>
