server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # assets com hash no nome → cache eterno
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # samples de áudio (apps com som embutido): mudam só com o nome, então também são imutáveis
    location /samples/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback (essencial p/ o roteamento por URL via History API)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sempre fresco, p/ updates aparecerem após novo deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
